name: Feature request
description: Suggest something Cadence should do.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The situation, not the solution. Knowing what you are working around
        usually turns up a better answer than the one either of us started with.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you had in mind
    validations:
      required: false
