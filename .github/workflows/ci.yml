name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A force-push to a branch with a run already going makes that run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  player:
    name: Player
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  site:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # Only the site's own dependencies. Nothing here reaches into `app/`, and
      # this job installing only what Vercel installs is what keeps it that way:
      # an import that creeps back across the boundary fails here first.
      - run: npm ci
        working-directory: site
      - run: npm run typecheck
        working-directory: site
      - run: npm run build
        working-directory: site

  shell:
    name: Desktop shell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # tauri-build reads the frontend output directory at compile time, and
      # `cargo check` fails outright if it is missing.
      - run: npm ci
      - run: npm run build

      # tauri-build validates the `resources` glob at compile time, not at
      # bundle time, so the shell does not build at all without FFmpeg present.
      # Cached on the pinned build name in the fetch script: the download is
      # 68MB and changes only when that line does.
      - name: Cache FFmpeg
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: src-tauri/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.mjs') }}

      - name: Fetch FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: npm run fetch:ffmpeg

      - name: Formatting
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
