name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A force-push to a branch with a run already going makes that run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  player:
    name: Player
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  site:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      # The site imports the design tokens and one component from `app/`, so
      # its dependencies have to be installed too or those imports resolve to
      # nothing. This is also what proves the cross-directory imports work
      # before Vercel finds out the hard way.
      - run: npm ci
      - run: npm ci
        working-directory: site
      - run: npm run typecheck
        working-directory: site
      - run: npm run build
        working-directory: site

  shell:
    name: Desktop shell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # tauri-build reads the frontend output directory at compile time, and
      # `cargo check` fails outright if it is missing.
      - run: npm ci
      - run: npm run build

      - name: Formatting
        run: cargo fmt --all --check
        working-directory: src-tauri

      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
