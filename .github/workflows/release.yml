name: Release

# Releases are cut from a tag, never from a branch push. The tag is the record
# of what was shipped, and it is what names the GitHub release the updater
# reads.
on:
  push:
    tags:
      - 'v*'
  # Retrying a failed release should not mean deleting and re-pushing a tag.
  # A tag is a record of what was shipped; moving one to get a second attempt
  # rewrites that record to paper over a build problem. This takes the tag as
  # an argument instead, so a run can be repeated as many times as it needs to
  # be against exactly the same commit.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release, e.g. v0.7.0'
        required: true

# Where the installers go. Not this repository: this one is private, and a
# release asset in a private repository is a 404 to everybody who is not signed
# in with access to it — which is everybody who wants to download Cadence. The
# public repository below holds no source, only the built files.
#
# Changing this name means changing `site/vercel.json` in the same commit, and
# nothing else: every address the outside world knows goes through the site.
env:
  RELEASE_REPO: mohanvd/cadence-releases

jobs:
  build:
    # No `contents: write` here. The release is created in another repository,
    # which the automatic GITHUB_TOKEN cannot reach however it is scoped, so
    # the steps below authenticate with RELEASES_TOKEN instead. This job writes
    # nothing back to this repository at all.

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      # Ask the question that decides the run, before paying for the run.
      #
      # Everything below this is about ten minutes of Windows runner: Rust,
      # FFmpeg, NSIS. Creating the release is the very last thing that happens,
      # so a token that cannot write to the release repository used to be
      # discovered only after the whole build had been bought and paid for —
      # ten minutes to be told about a permission checkbox. This asks first,
      # and fails in about a second.
      #
      # `permissions.push` is the repository's own answer to "can the bearer of
      # this token write here", which is exactly the question, rather than a
      # guess assembled from what the token claims about itself.
      - name: Check the release token
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::RELEASES_TOKEN is not set on this repository. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          if ! response=$(gh api "repos/$RELEASE_REPO" 2>&1); then
            echo "::error::RELEASES_TOKEN cannot see $RELEASE_REPO at all. Either the repository is not in the token's selected repositories, or the token has expired."
            echo "$response"
            exit 1
          fi

          push=$(printf '%s' "$response" | jq -r '.permissions.push // false')
          if [ "$push" != "true" ]; then
            echo "::error::RELEASES_TOKEN can read $RELEASE_REPO but cannot write to it. Give the token 'Contents: Read and write' — read-only is not enough to create a release."
            exit 1
          fi

          echo "RELEASES_TOKEN can write to $RELEASE_REPO. Building."

      - uses: actions/checkout@v4
        with:
          # On a tag push this is already what is checked out; on a manual run
          # it is the tag that was asked for rather than the default branch.
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # A cold Rust build of a Tauri app is several minutes of compiling
      # dependencies that did not change. Cache them against the lockfile.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - run: npm run typecheck

      # FFmpeg is a bundled resource and is not in the repository, so there is
      # nothing for the bundler to copy until this has run, and tauri-build
      # will not compile the shell without it either. Cached on the pinned
      # build name in the fetch script.
      - name: Cache FFmpeg
        id: ffmpeg
        uses: actions/cache@v4
        with:
          path: src-tauri/ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.mjs') }}

      - name: Fetch FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: npm run fetch:ffmpeg

      - id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          # A fine-grained personal access token with `Contents: read and write`
          # on RELEASE_REPO and nothing else. The built-in GITHUB_TOKEN is
          # scoped to this repository and cannot create a release in another.
          GITHUB_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          # Without these the build still produces an installer, but an unsigned
          # one, and the updater refuses anything it cannot verify, so every
          # client would silently stop updating.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # The release is cut in the public repository, from the tag pushed
          # here. The tag itself stays private with the source.
          owner: ${{ github.repository_owner }}
          repo: cadence-releases
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: 'Cadence ${{ inputs.tag || github.ref_name }}'
          releaseBody: |
            Download `Cadence-Setup.exe` below and run it.

            Existing installations update themselves; there is nothing to do.
          # Drafted rather than published: the updater endpoint resolves to the
          # latest *published* release, so nothing reaches existing users until
          # the release notes have been written and the draft is published by
          # hand. That manual step is the last chance to catch a bad build.
          releaseDraft: true
          prerelease: false
          # Generates and uploads `latest.json`, which is the file every
          # installed copy of Cadence polls to discover this release. The
          # download URLs inside it are addressed to whichever repository the
          # release was created in, so this follows `owner`/`repo` above.
          #
          # `includeUpdaterJson`, not `uploadUpdaterJson`: the input was renamed
          # upstream after the `v0` tag this workflow pins. An input this action
          # does not recognise is ignored in silence rather than refused, so the
          # wrong name here would look exactly like the right one until the day
          # the default changed and the updater stopped being fed.
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # The bundler's filename carries the version, so nothing can link to it
      # without being rewritten every release. The site links to a fixed name
      # instead, and this is what puts that name on the release.
      #
      # A copy, not a rename: `latest.json` refers to the versioned file by
      # name, and the updater will not find an asset that has been renamed out
      # from under it.
      - name: Publish the installer under a stable name
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          original=$(ls src-tauri/target/release/bundle/nsis/Cadence_*_x64-setup.exe)
          cp "$original" "Cadence-Setup.exe"
          gh release upload "${{ inputs.tag || github.ref_name }}" "Cadence-Setup.exe" \
            --repo "$RELEASE_REPO" --clobber
          echo "uploaded Cadence-Setup.exe (copy of $(basename "$original")) to $RELEASE_REPO"
