[package]
name = "cadence"
# Not what the installer is versioned from: see `version` in tauri.conf.json,
# which reads package.json. This one only names the crate.
version = "0.1.0"
description = "A keyboard-first media player."
authors = ["Mohanad Tarek"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# `cadence_lib` rather than `cadence`: the binary target already owns that name,
# and Cargo will not build two targets that resolve to the same crate name.
name = "cadence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` is what serves a file from disk to the media element, with
# range requests, so a film is streamed rather than read into memory to play.
# It is the counterpart to `app.security.assetProtocol` in tauri.conf.json, and
# the build fails if the two disagree.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The playback pipeline. FFmpeg's output reaches the page over a loopback
# socket rather than the Tauri IPC, because it is a stream that runs for the
# length of a film and the IPC is built for messages. Every crate here is
# already in Tauri's own dependency tree, so this costs no extra build.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["io-util", "net", "process", "rt", "time"] }

# Blu-ray subtitles are pictures, and the page wants them as images it can put
# on the screen. Already in Tauri's tree, so this costs no extra build either.
png = "0.17"

# The fonts a subtitle script asks for live where Windows records them, and the
# webview is not allowed to look. Already in Tauri's tree.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# Two things Windows will only hear from a program, not from a web page: which
# fonts are installed, and which application this is. Already in Tauri's tree.
windows-sys = { version = "0.59", features = ["Win32_UI_Shell", "Win32_Foundation"] }

# The "Now Playing" panel. It is a WinRT interface, so it wants the other
# binding — the one with the projections rather than the raw functions.
windows = { version = "0.61", features = [
    "Foundation",
    "Media",
    "Win32_Foundation",
    "Win32_System_WinRT",
] }

# Desktop-only. The updater has no meaning on mobile, where the store owns
# installation, and single-instance is a windowing concept that does not exist
# there either.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
