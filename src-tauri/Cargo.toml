[package]
name = "cadence"
# Not what the installer is versioned from: see `version` in tauri.conf.json,
# which reads package.json. This one only names the crate.
version = "0.1.0"
description = "A keyboard-first video player."
authors = ["Mohanad Tarek"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# `cadence_lib` rather than `cadence`: the binary target already owns that name,
# and Cargo will not build two targets that resolve to the same crate name.
name = "cadence_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` is what serves a file from disk to the media element, with
# range requests, so a film is streamed rather than read into memory to play.
# It is the counterpart to `app.security.assetProtocol` in tauri.conf.json, and
# the build fails if the two disagree.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only. The updater has no meaning on mobile, where the store owns
# installation, and single-instance is a windowing concept that does not exist
# there either.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
